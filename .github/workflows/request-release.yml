name: Request coordinated release
# A push to main (production channel) or preview (preview channel) asks hira-edu/hook for one coordinated
# release of that channel. hook resolves MeshAgent and hook to the same channel's branch, builds, pins,
# smoke-tests and, for preview, deploys; production deploys only from an operator's manual run in hook.
on:
  push:
    branches: [main, preview]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: request-coordinated-release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  dispatch:
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview') &&
      github.event.repository.default_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Every push requests a release, including the release app's own pin/lock commits: the release they
    # start is the one that ships them (hook refuses to pin or lock twice for one input).
    steps:
      - name: Require the release app credential
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY_SET: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$RELEASE_APP_ID" ] || [ "$RELEASE_APP_PRIVATE_KEY_SET" != true ]; then
            echo "::error title=Release dispatch::Set repository variable RELEASE_APP_ID and repository secret RELEASE_APP_PRIVATE_KEY (the release app, installed on hook) to request the coordinated release"
            exit 1
          fi
      - name: Create a short-lived dispatch token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: hook
          permission-contents: write
      - name: Request release from this exact source commit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          COORDINATOR: ${{ github.repository_owner }}/hook
        run: |
          python - <<'PY' > request.json
          import json, os
          print(json.dumps({'event_type': 'sibling-source-updated', 'client_payload': {
              'repository': os.environ['GITHUB_REPOSITORY'], 'sha': os.environ['GITHUB_SHA'],
              'branch': os.environ['GITHUB_REF_NAME']}}))
          PY
          gh api --method POST "repos/$COORDINATOR/dispatches" --input request.json
