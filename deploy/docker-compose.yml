version: '3.8'
services:
  meshcentral:
    image: ghcr.io/ylianst/meshcentral:1.2.1
    container_name: meshcentral
    restart: unless-stopped
    ports:
      - "4430:4430"    # Adjust to match config.json
      - "80:80"        # Redirect port if used
    environment:
      - NODE_ENV=production
    volumes:
      - ./meshcentral-data:/opt/meshcentral/meshcentral-data
      # MeshCentral loads local plugins from <datapath>/plugins.
      - ./plugins:/opt/meshcentral/meshcentral-data/plugins:ro
      # Partial web override containing scripts/custom.js.
      - ./public:/opt/meshcentral/meshcentral-data/public:ro
